<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A focused currency converter with validated inputs, safe rendering, and clear network states." />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Currency Converter" />
    <meta property="og:description" content="A focused currency converter with validated inputs, safe rendering, and clear network states." />
    <meta name="twitter:card" content="summary" />

    <title>Currency Converter</title>
    <link rel="stylesheet" href="main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet" />
  </head>
  <body>
    <main>
      <h1>Currency Converter</h1>
      <form id="currency-form" class="currency-converter">
        <label for="amount">Amount</label>
        <input id="amount" type="number" class="amount" placeholder="100" min="0.01" max="1000000000000" step="0.01" inputmode="decimal" required />
        <div class="currency-fields">
          <label for="from">From</label>
          <select id="from" class="from" required>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="EGP">EGP</option>
            <option value="KWD">KWD</option>
            <option value="GBP">GBP</option>
          </select>
          <label for="to">To</label>
          <select id="to" class="to" required>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="EGP">EGP</option>
            <option value="KWD">KWD</option>
            <option value="GBP">GBP</option>
          </select>
        </div>
        <button id="convert" type="submit">Convert</button>
        <p class="result" role="status" aria-live="polite">Enter an amount to begin.</p>
      </form>
    </main>
    <script src="main.js"></script>
  </body>
</html>
